<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <title>VERTEX | Ткани из Китая и Турции — Оптом и в розницу</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --accent: #ea580c; 
            --accent-hover: #c2410c; 
        }
        html {
            scroll-behavior: smooth;
        }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #070708; 
            color: #fff; 
            margin: 0; 
            overflow-x: hidden; 
            -webkit-tap-highlight-color: transparent;
        }

        /* ЖИВОЙ ФОН */
        .live-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            animation: zoomBg 24s infinite alternate ease-in-out;
            will-change: transform;
        }

        @keyframes zoomBg {
            from { transform: scale(1); }
            to { transform: scale(1.06); }
        }

        .glass {
            background: rgba(13, 13, 16, 0.78);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-card {
            background: rgba(18, 18, 22, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .glass-input:focus {
            border-color: #ea580c;
            background: rgba(255, 255, 255, 0.08);
        }

        .accent-bg { background-color: var(--accent); }
        .accent-bg:hover { background-color: var(--accent-hover); }

        .hero-title {
            line-height: 0.92;
            letter-spacing: -0.04em;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .swipe-zone {
            touch-action: pan-y;
            user-select: none;
            -webkit-user-select: none;
        }

        [x-cloak] { display: none !important; }
    </style>
</head>
<body x-data="megatextile()" x-init="init()" class="selection:bg-orange-600 selection:text-white antialiased">

    <!-- ЖИВОЙ ФОН САЙТА -->
    <div class="live-bg" :style="'background-image: linear-gradient(rgba(7,7,10,0.80), rgba(7,7,10,0.90)), url(' + currentBg + ');'"></div>

    <!-- ВЕРХНИЙ ИНФО-БАР ДЛЯ TELEGRAM МИНИ-ПРИЛОЖЕНИЯ -->
    <template x-if="isTelegram && telegramUser">
        <div class="fixed top-0 left-0 right-0 z-[110] bg-orange-600/90 text-white text-[10px] sm:text-xs py-1 px-4 flex justify-between items-center font-bold">
            <div class="flex items-center gap-1.5 truncate">
                <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.446 1.394c-.16.16-.295.295-.605.295l.213-3.053 5.56-5.023c.242-.213-.054-.333-.373-.121l-6.871 4.326-2.962-.924c-.643-.204-.657-.643.136-.953l11.57-4.461c.537-.194 1.006.131.832.942z"/></svg>
                <span>Telegram Mini App</span>
                <span class="opacity-80" x-text="'• ' + (telegramUser.first_name || '') + (telegramUser.username ? ' (@' + telegramUser.username + ')' : '')"></span>
            </div>
            <span x-show="isAdmin" class="bg-black/40 px-2 py-0.5 rounded-full text-[9px] uppercase tracking-wider">Админ</span>
        </div>
    </template>

    <!-- НАВИГАЦИЯ -->
    <nav class="fixed top-0 w-full z-[100] glass px-4 sm:px-6 md:px-8 py-3 sm:py-4 flex justify-between items-center border-b border-white/10 transition-all"
         :class="isTelegram && telegramUser ? 'mt-6' : ''">
        <div class="flex items-center gap-3 sm:gap-4 cursor-pointer" @click="view='catalog'; haptic('light')">
            <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl accent-bg flex items-center justify-center font-black text-lg sm:text-xl italic shadow-lg shadow-orange-600/30">
                M
            </div>
            <div class="flex flex-col leading-none">
                <span class="text-xl sm:text-2xl font-black tracking-tighter uppercase italic">VERTEX</span>
                <span class="text-[8px] sm:text-[9px] tracking-[0.25em] sm:tracking-[0.4em] text-orange-500 uppercase font-bold mt-0.5">Ткани из Китая и Турции</span>
            </div>
        </div>

        <div class="flex items-center gap-2 sm:gap-4 md:gap-6">
            <button @click="view='catalog'; haptic('light')" 
                    :class="view==='catalog' ? 'text-orange-500 font-black' : 'text-gray-300 hover:text-white'"
                    class="px-2.5 sm:px-3 py-1.5 text-xs sm:text-xs tracking-wider transition uppercase font-bold">
                Каталог
            </button>

            <!-- Кнопка входа в админку -->
            <template x-if="!isAdmin">
                <button @click="openLoginModal()" 
                        class="px-3.5 sm:px-5 py-2 sm:py-2.5 glass rounded-full text-[10px] sm:text-[11px] font-black uppercase tracking-wider hover:bg-white hover:text-black transition flex items-center gap-1.5 shadow-md">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                    <span>Админ</span>
                </button>
            </template>

            <!-- Кнопки управления для авторизованного админа -->
            <template x-if="isAdmin">
                <div class="flex items-center gap-2">
                    <button @click="view='admin'; haptic('light')" 
                            :class="view==='admin' ? 'accent-bg text-white' : 'glass text-orange-400 hover:bg-orange-600 hover:text-white'"
                            class="px-3 sm:px-4 py-2 rounded-full text-[10px] sm:text-[11px] font-black uppercase tracking-wider transition flex items-center gap-1.5 shadow-lg">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                        <span>Управление</span>
                    </button>
                    <button @click="logout()" 
                            title="Выйти из админки"
                            class="p-2 glass rounded-full text-gray-400 hover:text-red-400 hover:bg-white/10 transition">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                    </button>
                </div>
            </template>
        </div>
    </nav>

    <!-- КАТАЛОГ -->
    <template x-if="view === 'catalog'">
        <main class="pt-24 sm:pt-32 md:pt-40 px-4 sm:px-6 md:px-8 max-w-7xl mx-auto pb-24"
              :class="isTelegram && telegramUser ? 'pt-28 sm:pt-36' : ''">
            
            <!-- ГЕРОЙ-СЕКЦИЯ -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 lg:gap-14 items-center mb-16 sm:mb-24">
                <div class="z-10">
                    <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full glass border border-orange-500/30 text-orange-400 text-[10px] sm:text-xs font-bold uppercase tracking-[0.2em] mb-4 sm:mb-6">
                        <span class="w-2 h-2 rounded-full bg-orange-500 animate-pulse"></span>
                        Megatextile Fabric &bull; Коллекция 2024
                    </div>
                    <h1 class="hero-title text-4xl sm:text-6xl md:text-7xl xl:text-8xl font-black uppercase italic mb-4 sm:mb-8">
                        Стойкость<br><span class="text-orange-500">к износу</span>
                    </h1>
                    <div class="max-w-xl border-l-2 border-orange-500 pl-4 sm:pl-6 py-1.5 sm:py-2 mb-6 sm:mb-8">
                        <p class="text-gray-300 text-sm sm:text-base md:text-lg leading-relaxed">
                            Качественная ткань сохраняет первозданный вид даже после многократного использования. Специализированные мебельные ткани для диванов, кресел и эксклюзивных интерьеров.
                        </p>
                    </div>

                    <!-- 3 ПРЕИМУЩЕСТВА -->
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 sm:gap-4 pt-1 sm:pt-2">
                        <div class="glass p-3.5 sm:p-4 rounded-2xl border border-white/5">
                            <div class="w-8 h-8 rounded-lg bg-orange-500/20 text-orange-400 flex items-center justify-center mb-2">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
                            </div>
                            <h4 class="text-xs font-black uppercase tracking-wider mb-0.5">Истирание</h4>
                            <p class="text-[11px] text-gray-400 leading-snug">Не скатывается и держит структуру</p>
                        </div>
                        <div class="glass p-3.5 sm:p-4 rounded-2xl border border-white/5">
                            <div class="w-8 h-8 rounded-lg bg-orange-500/20 text-orange-400 flex items-center justify-center mb-2">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                            </div>
                            <h4 class="text-xs font-black uppercase tracking-wider mb-0.5">Стирка</h4>
                            <p class="text-[11px] text-gray-400 leading-snug">Не садится и не теряет цвет</p>
                        </div>
                        <div class="glass p-3.5 sm:p-4 rounded-2xl border border-white/5">
                            <div class="w-8 h-8 rounded-lg bg-orange-500/20 text-orange-400 flex items-center justify-center mb-2">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
                            </div>
                            <h4 class="text-xs font-black uppercase tracking-wider mb-0.5">Прочность</h4>
                            <p class="text-[11px] text-gray-400 leading-snug">Плотное высокопрочное волокно</p>
                        </div>
                    </div>
                </div>
                
                <!-- ПРАВЫЙ БЛОК ГЕРОЯ С ФОТО -->
                <div class="relative group mt-4 lg:mt-0">
                    <div class="absolute -inset-4 bg-orange-600/20 blur-3xl rounded-full opacity-60 group-hover:opacity-100 transition duration-1000"></div>
                    <div class="relative rounded-3xl sm:rounded-[2.5rem] overflow-hidden shadow-2xl border border-white/10 glass">
                        <img :src="currentBg" 
                             alt="VERTEX ткани" 
                             class="w-full h-64 sm:h-80 md:h-[400px] lg:h-[460px] object-cover transition-transform duration-1000 group-hover:scale-105">
                        <div class="absolute bottom-4 sm:bottom-6 left-4 sm:left-6 right-4 sm:right-6 flex justify-between items-center glass p-3 sm:p-4 rounded-2xl">
                            <div>
                                <span class="text-[9px] sm:text-[10px] font-black uppercase tracking-[0.2em] text-orange-400 block mb-0.5">Премиум текстиль</span>
                                <span class="text-xs sm:text-sm font-bold text-white">Прямые поставки Китай & Турция</span>
                            </div>
                            <template x-if="isAdmin">
                                <button @click="view='admin'; adminTab='background'; haptic('light')" class="px-3 py-1.5 text-[9px] sm:text-[10px] font-bold rounded-lg accent-bg uppercase tracking-wider text-white">Сменить фон</button>
                            </template>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ПАНЕЛЬ КАТЕГОРИЙ И ФИЛЬТРОВ -->
            <div class="mb-8 sm:mb-10">
                <div class="flex flex-wrap items-center justify-between gap-4 mb-4 sm:mb-6">
                    <div>
                        <h2 class="text-2xl sm:text-3xl font-black uppercase tracking-tight italic">Каталог тканей</h2>
                        <p class="text-xs text-gray-400 mt-1" x-text="'Всего товаров: ' + filteredProducts.length"></p>
                    </div>

                    <!-- Быстрые действия для админа -->
                    <template x-if="isAdmin">
                        <div class="flex flex-wrap items-center gap-2">
                            <button @click="openCreateProductModal()" 
                                    class="px-3.5 sm:px-4 py-2 sm:py-2.5 accent-bg rounded-xl text-xs font-black uppercase tracking-wider flex items-center gap-2 hover:brightness-110 transition shadow-lg shadow-orange-600/30">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                                <span>Добавить товар</span>
                            </button>
                            <button @click="view='admin'; adminTab='admins'; haptic('light')" 
                                    class="px-3.5 sm:px-4 py-2 sm:py-2.5 glass rounded-xl text-xs font-bold uppercase tracking-wider text-orange-400 hover:text-white transition flex items-center gap-1.5 border border-orange-500/30">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                                <span>Поделиться правами</span>
                            </button>
                        </div>
                    </template>
                </div>

                <!-- ПОДСКАЗКА ДЛЯ МОБИЛЬНЫХ УСТРОЙСТВ И ТЕЛЕГРАМ -->
                <div class="flex items-center gap-2 text-xs text-gray-400 mb-3 sm:hidden">
                    <svg class="w-4 h-4 text-orange-400 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg>
                    <span>Свайпайте категории и фото тканей влево/вправо</span>
                </div>

                <!-- КНОПКИ КАТЕГОРИЙ -->
                <div class="flex items-center gap-2 sm:gap-3 overflow-x-auto pb-3 pt-1 no-scrollbar scroll-smooth -mx-4 px-4 sm:mx-0 sm:px-0">
                    <button @click="activeCat = 'Все'; haptic('light')" 
                            :class="activeCat === 'Все' ? 'accent-bg shadow-lg shadow-orange-600/30 text-white font-black scale-[1.02]' : 'glass opacity-80 hover:opacity-100 text-gray-300'"
                            class="px-4 sm:px-6 py-2.5 sm:py-3 rounded-2xl text-[11px] sm:text-xs font-bold uppercase tracking-[0.15em] transition-all whitespace-nowrap active:scale-95">
                        Все (<span x-text="products.length"></span>)
                    </button>
                    <template x-for="cat in categories" :key="cat">
                        <button @click="activeCat = cat; haptic('light')" 
                                :class="activeCat === cat ? 'accent-bg shadow-lg shadow-orange-600/30 text-white font-black scale-[1.02]' : 'glass opacity-80 hover:opacity-100 text-gray-300'"
                                class="px-4 sm:px-6 py-2.5 sm:py-3 rounded-2xl text-[11px] sm:text-xs font-bold uppercase tracking-[0.15em] transition-all whitespace-nowrap flex items-center gap-1.5 sm:gap-2 active:scale-95">
                            <span x-text="cat"></span>
                            <span class="text-[9px] opacity-75 font-semibold" x-text="'(' + countByCategory(cat) + ')'"></span>
                        </button>
                    </template>
                </div>
            </div>

            <!-- ИНДИКАТОР ЗАГРУЗКИ (SKELETON И НАДПИСЬ) -->
            <template x-if="isLoading">
                <div>
                    <!-- Баннер о загрузке каталога -->
                    <div class="glass p-6 sm:p-8 rounded-3xl border border-orange-500/20 text-center mb-8 flex flex-col items-center justify-center animate-pulse shadow-2xl">
                        <div class="w-10 h-10 border-4 border-orange-500 border-t-transparent rounded-full animate-spin mb-3"></div>
                        <h3 class="text-base sm:text-xl font-black uppercase italic tracking-tight text-white mb-1">
                            Подождите немного, идет загрузка каталога...
                        </h3>
                        <p class="text-xs sm:text-sm text-gray-400">Загружаем ткани и фотографии из базы данных</p>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-8 lg:gap-10">
                        <template x-for="i in [1, 2, 3, 4, 5, 6]" :key="i">
                            <div class="glass-card rounded-3xl sm:rounded-[2.5rem] p-4 sm:p-5 flex flex-col h-[480px] animate-pulse">
                                <div class="aspect-[4/5] rounded-2xl sm:rounded-[2rem] bg-white/5 mb-4"></div>
                                <div class="h-6 bg-white/10 rounded-xl mb-3 w-3/4"></div>
                                <div class="h-4 bg-white/5 rounded-lg mb-2 w-full"></div>
                                <div class="h-4 bg-white/5 rounded-lg mb-4 w-1/2"></div>
                                <div class="h-12 bg-white/10 rounded-2xl mt-auto"></div>
                            </div>
                        </template>
                    </div>
                </div>
            </template>

            <!-- ПУСТОЙ КАТАЛОГ -->
            <template x-if="!isLoading && filteredProducts.length === 0">
                <div class="glass rounded-3xl p-10 sm:p-16 text-center max-w-xl mx-auto my-12">
                    <div class="w-16 h-16 rounded-2xl bg-white/5 mx-auto flex items-center justify-center text-gray-500 mb-4">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/></svg>
                    </div>
                    <h3 class="text-xl font-bold mb-2">В этой категории пока нет тканей</h3>
                    <p class="text-gray-400 text-sm mb-6">Добавьте ткани в панели управления или выберите другую категорию.</p>
                    <template x-if="isAdmin">
                        <button @click="openCreateProductModal(activeCat !== 'Все' ? activeCat : '')" class="px-6 py-3 accent-bg rounded-xl text-xs font-black uppercase tracking-wider">
                            + Добавить ткань в категорию
                        </button>
                    </template>
                </div>
            </template>

            <!-- СЕТКА ТОВАРОВ СО СВАЙПОМ ФОТО -->
            <div x-show="!isLoading && filteredProducts.length > 0" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-8 lg:gap-10">
                <template x-for="p in filteredProducts" :key="p.id">
                    <div class="group/card glass-card rounded-3xl sm:rounded-[2.5rem] p-4 sm:p-5 flex flex-col h-full border border-white/5 hover:border-orange-500/30 transition-all duration-300 relative">
                        
                        <!-- КАРТИНКА И СЛАЙДЕР С ЖЕСТАМИ СВАЙПА ПАЛЬЦЕМ -->
                        <div class="aspect-[4/5] rounded-2xl sm:rounded-[2rem] overflow-hidden bg-black/50 relative mb-4 sm:mb-5 shadow-xl select-none group/imgbox swipe-zone"
                             @touchstart="onCardTouchStart($event)"
                             @touchend="onCardTouchEnd($event, p)">
                            
                            <!-- ПЛАВНАЯ ЛЕНТА СЛАЙДЕРА ФОТОГРАФИЙ -->
                            <div class="w-full h-full relative cursor-pointer" @click="openQuickView(p, p.activeImgIdx || 0)">
                                <div class="flex h-full w-full transition-transform duration-300 ease-out"
                                     :style="'transform: translateX(-' + ((p.activeImgIdx || 0) * 100) + '%);'">

                            <div>
                                <h4 class="font-bold text-sm uppercase tracking-wider mb-2 flex items-center gap-2">
                                    <svg class="w-4 h-4 text-orange-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg>
                                    Указать ссылку на фото (URL)
                                </h4>
                                <p class="text-xs text-gray-400 mb-2">Например: <code class="text-orange-300">background.jpg</code> или прямая веб-ссылка.</p>
                            </div>
                            <div class="flex gap-2">
                                <input x-model="bgInputUrl" type="text" placeholder="background.jpg или https://..." 
                                       class="glass-input flex-grow p-3 rounded-xl outline-none text-xs text-white">
                                <button @click="applyBgUrl" class="px-4 py-3 glass hover:bg-white/10 rounded-xl text-xs font-bold uppercase">
                                    Применить
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="mt-6 pt-6 border-t border-white/10 flex flex-wrap justify-between items-center gap-4">
                        <button @click="resetBgToDefault" class="text-xs text-gray-400 hover:text-white uppercase font-bold tracking-wider">
                            ↺ Сбросить к стандартному фону (background.jpg)
                        </button>
                        <button @click="resetAllDemoData" class="text-xs text-red-400 hover:text-red-300 uppercase font-bold tracking-wider">
                            ⚠ Сбросить каталог к начальным данным
                        </button>
                    </div>
                </div>
            </div>

            <!-- ВКЛАДКА 4: АДМИНИСТРАТОРЫ И УПРАВЛЕНИЕ ДОСТУПОМ -->
            <div x-show="adminTab === 'admins'" class="space-y-6 sm:space-y-8">
                
                <!-- СЕКЦИЯ 1: СЕКРЕТНАЯ ССЫЛКА ДЛЯ 1-КЛИК ДОСТУПА -->
                <div class="glass p-5 sm:p-8 rounded-3xl sm:rounded-[2.5rem] border border-orange-500/30 shadow-2xl relative overflow-hidden">
                    <div class="absolute -right-10 -bottom-10 w-44 h-44 bg-orange-600/10 rounded-full blur-2xl pointer-events-none"></div>

                    <div class="flex items-center gap-3 mb-3">
                        <div class="w-10 h-10 rounded-2xl bg-orange-500/20 text-orange-400 flex items-center justify-center font-black">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg>
                        </div>
                        <div>
                            <h3 class="text-xl sm:text-2xl font-black uppercase italic tracking-tight">Поделиться правами в 1 клик</h3>
                            <p class="text-xs text-gray-400">Секретная ссылка для передачи прав администратора коллеге</p>
                        </div>
                    </div>

                    <p class="text-xs text-gray-300 leading-relaxed mb-4">
                        Отправьте эту ссылку партнеру или коллеге в Telegram или WhatsApp. Перейдя по ней, он <b>мгновенно получит полные права администратора</b> на редактирование каталога тканей без необходимости вводить логины и пароли!
                    </p>

                    <div class="space-y-3">
                        <div class="flex flex-col sm:flex-row gap-2">
                            <input :value="shareableAdminLink" readonly 
                                   class="glass-input flex-grow p-3.5 rounded-xl sm:rounded-2xl outline-none text-xs text-orange-300 font-mono select-all">
                            <button @click="copyAdminLink()" 
                                    class="px-5 py-3.5 glass hover:bg-white/10 rounded-xl sm:rounded-2xl text-xs font-bold uppercase transition flex items-center justify-center gap-2 whitespace-nowrap active:scale-95">
                                <svg class="w-4 h-4 text-orange-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                                <span x-text="adminLinkCopied ? 'Скопировано! ✓' : 'Скопировать'"></span>
                            </button>
                        </div>

                        <div class="flex flex-wrap gap-2 pt-1">
                            <button @click="shareAdminInTelegram()" 
                                    class="px-5 py-3 bg-sky-500 hover:bg-sky-600 text-white rounded-xl text-xs font-black uppercase tracking-wider flex items-center gap-2 shadow-lg transition active:scale-95">
                                <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.446 1.394c-.16.16-.295.295-.605.295l.213-3.053 5.56-5.023c.242-.213-.054-.333-.373-.121l-6.871 4.326-2.962-.924c-.643-.204-.657-.643.136-.953l11.57-4.461c.537-.194 1.006.131.832.942z"/></svg>
                                <span>Отправить в Telegram</span>
                            </button>
                            <a :href="'https://wa.me/?text=' + encodeURIComponent('Вот секретная ссылка с правами администратора каталога тканей VERTEX: ' + shareableAdminLink)" 
                               target="_blank"
                               class="px-5 py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-black uppercase tracking-wider flex items-center gap-2 shadow-lg transition active:scale-95">
                                <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/></svg>
                                <span>Отправить в WhatsApp</span>
                            </a>
                        </div>
                    </div>
                </div>

                <!-- СЕКЦИЯ 2: НАЗНАЧЕНИЕ АДМИНИСТРАТОРОВ ПО TELEGRAM @USERNAME -->
                <div class="glass p-5 sm:p-8 rounded-3xl sm:rounded-[2.5rem] border border-white/10">
                    <div class="flex items-center gap-3 mb-4">
                        <div class="w-10 h-10 rounded-2xl bg-sky-500/20 text-sky-400 flex items-center justify-center font-black">
                            <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.446 1.394c-.16.16-.295.295-.605.295l.213-3.053 5.56-5.023c.242-.213-.054-.333-.373-.121l-6.871 4.326-2.962-.924c-.643-.204-.657-.643.136-.953l11.57-4.461c.537-.194 1.006.131.832.942z"/></svg>
                        </div>
                        <div>
                            <h3 class="text-xl sm:text-2xl font-black uppercase italic tracking-tight">Администраторы Telegram</h3>
                            <p class="text-xs text-gray-400">Пользователи, имеющие права управления при открытии бота</p>
                        </div>
                    </div>

                    <div class="flex flex-col sm:flex-row gap-2 mb-6">
                        <input x-model="newTgAdminInput" @keydown.enter.prevent="addTelegramAdmin()" 
                               type="text" placeholder="@username коллеги в Telegram" 
                               class="glass-input flex-grow p-3.5 sm:p-4 rounded-xl sm:rounded-2xl outline-none text-white text-sm placeholder-gray-500">
                        <button @click="addTelegramAdmin()" 
                                class="px-6 py-3.5 sm:py-4 accent-bg rounded-xl sm:rounded-2xl font-black uppercase tracking-wider text-xs hover:brightness-110 transition whitespace-nowrap shadow-lg shadow-orange-600/30 text-white">
                            + Назначить админом
                        </button>
                    </div>

                    <div class="space-y-2.5">
                        <h4 class="text-xs uppercase font-bold text-gray-400 tracking-wider mb-2">Авторизованные Telegram-аккаунты:</h4>
                        <template x-for="adminUser in telegramAdmins" :key="adminUser">
                            <div class="flex items-center justify-between p-3.5 glass-card rounded-2xl border border-white/5">
                                <div class="flex items-center gap-3">
                                    <div class="w-8 h-8 rounded-full bg-sky-500/20 text-sky-400 flex items-center justify-center text-xs font-bold">
                                        @
                                    </div>
                                    <span class="font-bold text-sm" x-text="'@' + adminUser"></span>
                                </div>
                                <button @click="removeTelegramAdmin(adminUser)" 
                                        title="Отозвать права"
                                        class="px-3 py-1.5 glass hover:bg-red-600 text-red-300 hover:text-white rounded-xl text-xs font-bold uppercase transition flex items-center gap-1">
                                    ✕ <span class="hidden sm:inline">Отозвать</span>
                                </button>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- СЕКЦИЯ 3: MASTER PIN-КОД -->
                <div class="glass p-5 sm:p-8 rounded-3xl sm:rounded-[2.5rem] border border-white/10">
                    <div class="flex items-center justify-between flex-wrap gap-4">
                        <div>
                            <h3 class="text-xl font-black uppercase italic tracking-tight mb-1">Master PIN-код для входа</h3>
                            <p class="text-xs text-gray-400">Используется для быстрого входа в панель управления с любого устройства</p>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="text-2xl font-black font-mono text-orange-400 tracking-widest px-4 py-2 glass rounded-2xl" x-text="adminPin"></span>
                            <button @click="updateAdminPin()" 
                                    class="px-4 py-2.5 glass hover:bg-orange-600 rounded-xl text-xs font-bold uppercase transition">
                                Сменить PIN
                            </button>
                        </div>
                    </div>
                </div>

            </div>

        </section>
    </template>

    <!-- ИНИЦИАЛИЗАЦИЯ ПРИЛОЖЕНИЯ -->
    <script>
        function megatextile() {
            return window.megatextileCloud();
        }
    </script>
</body>
</html>
