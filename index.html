<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERTEX | Ткани из Китая и Турции</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #ea580c; --accent-hover: #c2410c; }
        body { font-family: 'Inter', sans-serif; background-color: #070708; color: #fff; margin: 0; overflow-x: hidden; }

        /* ЖИВОЙ ФОН */
        .live-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            animation: zoomBg 24s infinite alternate ease-in-out;
            will-change: transform;
        }

        @keyframes zoomBg {
            from { transform: scale(1); }
            to { transform: scale(1.06); }
        }

        .glass {
            background: rgba(13, 13, 16, 0.72);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-card {
            background: rgba(18, 18, 22, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.07);
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .glass-input:focus {
            border-color: #ea580c;
            background: rgba(255, 255, 255, 0.08);
        }

        .accent-bg { background-color: var(--accent); }
        .accent-bg:hover { background-color: var(--accent-hover); }

        .hero-title {
            line-height: 0.92;
            letter-spacing: -0.04em;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        [x-cloak] { display: none !important; }
    </style>
</head>
<body x-data="megatextile()" x-init="init()" class="selection:bg-orange-600 selection:text-white">

    <!-- ЖИВОЙ ФОН САЙТА -->
    <div class="live-bg" :style="'background-image: linear-gradient(rgba(7,7,10,0.78), rgba(7,7,10,0.88)), url(' + currentBg + ');'"></div>

    <!-- НАВИГАЦИЯ -->
    <nav class="fixed top-0 w-full z-[100] glass px-6 py-4 flex justify-between items-center border-b border-white/10 transition-all">
        <div class="flex items-center gap-4 cursor-pointer" @click="view='catalog'">
            <div class="w-10 h-10 rounded-xl accent-bg flex items-center justify-center font-black text-xl italic shadow-lg shadow-orange-600/30">
                M
            </div>
            <div class="flex flex-col leading-none">
                <span class="text-2xl font-black tracking-tighter uppercase italic">VERTEX</span>
                <span class="text-[9px] tracking-[0.5em] text-orange-500 uppercase font-bold">Ткани из Китая и Турции</span>
            </div>
        </div>

        <div class="flex items-center gap-4 md:gap-8">
            <button @click="view='catalog'" 
                    :class="view==='catalog' ? 'text-orange-500 font-black' : 'text-gray-300 hover:text-white'"
                    class="text-xs tracking-widest transition uppercase font-bold">
                Каталог
            </button>

            <!-- Кнопка админки -->
            <template x-if="!isAdmin">
                <button @click="login()" 
                        class="px-5 py-2.5 glass rounded-full text-[10px] font-black uppercase tracking-widest hover:bg-white hover:text-black transition flex items-center gap-2">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                    <span>Админ</span>
                </button>
            </template>
            <template x-if="isAdmin">
                <div class="flex items-center gap-2">
                    <button @click="view='admin'" 
                            :class="view==='admin' ? 'accent-bg text-white' : 'glass text-orange-400 hover:bg-orange-600 hover:text-white'"
                            class="px-4 py-2 rounded-full text-[10px] font-black uppercase tracking-widest transition flex items-center gap-1.5 shadow-lg">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                        <span>Управление</span>
                    </button>
                    <button @click="logout()" 
                            title="Выйти из админки"
                            class="p-2 glass rounded-full text-gray-400 hover:text-red-400 hover:bg-white/10 transition">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                    </button>
                </div>
            </template>
        </div>
    </nav>

    <!-- КАТАЛОГ -->
    <template x-if="view === 'catalog'">
        <main class="pt-32 md:pt-44 px-6 max-w-7xl mx-auto pb-24">
            
            <!-- ГЕРОЙ-СЕКЦИЯ ПО МОТИВАМ ПРИКРЕПЛЁННОГО ФОТО -->
            <div class="grid lg:grid-cols-2 gap-12 lg:gap-16 items-center mb-24">
                <div class="z-10">
                    <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full glass border border-orange-500/30 text-orange-400 text-xs font-bold uppercase tracking-[0.25em] mb-6">
                        <span class="w-2 h-2 rounded-full bg-orange-500 animate-pulse"></span>
                        Megatextile Fabric &bull; Art. 03
                    </div>
                    <h1 class="hero-title text-5xl sm:text-6xl md:text-7xl xl:text-8xl font-black uppercase italic mb-8">
                        Стойкость<br><span class="text-orange-500">к износу</span>
                    </h1>
                    <div class="max-w-xl border-l-2 border-orange-500 pl-6 py-2 mb-8">
                        <p class="text-gray-300 text-base md:text-lg leading-relaxed">
                            Качественная ткань сохраняет первозданный вид даже после многократного использования. Специализированные мебельные ткани для диванов, кресел и эксклюзивных интерьеров.
                        </p>
                    </div>

                    <!-- 3 ПРЕИМУЩЕСТВА С ИКОНКАМИ -->
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 pt-2">
                        <div class="glass p-4 rounded-2xl border border-white/5">
                            <div class="w-8 h-8 rounded-lg bg-orange-500/20 text-orange-400 flex items-center justify-center mb-2">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
                            </div>
                            <h4 class="text-xs font-black uppercase tracking-wider mb-1">Истирание</h4>
                            <p class="text-[11px] text-gray-400 leading-snug">Не скатывается и держит структуру</p>
                        </div>
                        <div class="glass p-4 rounded-2xl border border-white/5">
                            <div class="w-8 h-8 rounded-lg bg-orange-500/20 text-orange-400 flex items-center justify-center mb-2">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                            </div>
                            <h4 class="text-xs font-black uppercase tracking-wider mb-1">Стирка</h4>
                            <p class="text-[11px] text-gray-400 leading-snug">Не садится и не теряет сочный цвет</p>
                        </div>
                        <div class="glass p-4 rounded-2xl border border-white/5">
                            <div class="w-8 h-8 rounded-lg bg-orange-500/20 text-orange-400 flex items-center justify-center mb-2">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
                            </div>
                            <h4 class="text-xs font-black uppercase tracking-wider mb-1">Прочность</h4>
                            <p class="text-[11px] text-gray-400 leading-snug">Плотное высокопрочное волокно</p>
                        </div>
                    </div>
                </div>
                
                <!-- ПРАВЫЙ БЛОК ГЕРОЯ С ФОТО -->
                <div class="relative group">
                    <div class="absolute -inset-4 bg-orange-600/20 blur-3xl rounded-full opacity-60 group-hover:opacity-100 transition duration-1000"></div>
                    <div class="relative rounded-[2.5rem] overflow-hidden shadow-2xl border border-white/10 glass">
                        <img :src="currentBg" 
                             alt="Megatextile ткани" 
                             class="w-full h-[460px] object-cover transition-transform duration-1000 group-hover:scale-105">
                        <div class="absolute bottom-6 left-6 right-6 flex justify-between items-center glass p-4 rounded-2xl">
                            <div>
                                <span class="text-[10px] font-black uppercase tracking-[0.25em] text-orange-400 block mb-0.5">Коллекция 2024</span>
                                <span class="text-sm font-bold text-white">Мебельный текстиль высокого класса</span>
                            </div>
                            <template x-if="isAdmin">
                                <button @click="view='admin'; adminTab='background'" class="px-3 py-1.5 text-[10px] font-bold rounded-lg accent-bg uppercase tracking-wider text-white">Сменить фон</button>
                            </template>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ПАНЕЛЬ КАТЕГОРИЙ И ФИЛЬТРОВ -->
            <div class="mb-10">
                <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
                    <div>
                        <h2 class="text-3xl font-black uppercase tracking-tight italic">Каталог тканей</h2>
                        <p class="text-xs text-gray-400 mt-1" x-text="'Всего товаров: ' + filteredProducts.length"></p>
                    </div>

                    <!-- Быстрые действия для админа -->
                    <template x-if="isAdmin">
                        <div class="flex items-center gap-2">
                            <button @click="openCreateProductModal()" 
                                    class="px-4 py-2.5 accent-bg rounded-xl text-xs font-black uppercase tracking-widest flex items-center gap-2 hover:brightness-110 transition shadow-lg shadow-orange-600/30">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                                <span>Добавить товар</span>
                            </button>
                            <button @click="view='admin'; adminTab='categories'" 
                                    class="px-4 py-2.5 glass rounded-xl text-xs font-bold uppercase tracking-wider text-gray-300 hover:text-white hover:border-orange-500/50 transition flex items-center gap-1.5">
                                <svg class="w-4 h-4 text-orange-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/></svg>
                                <span>Управление категориями</span>
                            </button>
                        </div>
                    </template>
                </div>

                <!-- КНОПКИ КАТЕГОРИЙ -->
                <div class="flex items-center gap-3 overflow-x-auto pb-4 no-scrollbar">
                    <button @click="activeCat = 'Все'" 
                            :class="activeCat === 'Все' ? 'accent-bg scale-105 shadow-lg shadow-orange-600/30' : 'glass opacity-70 hover:opacity-100'"
                            class="px-6 py-3 rounded-2xl text-[11px] font-black uppercase tracking-[0.2em] transition-all whitespace-nowrap">
                        Все (<span x-text="products.length"></span>)
                    </button>
                    <template x-for="cat in categories" :key="cat">
                        <button @click="activeCat = cat" 
                                :class="activeCat === cat ? 'accent-bg scale-105 shadow-lg shadow-orange-600/30' : 'glass opacity-70 hover:opacity-100'"
                                class="px-6 py-3 rounded-2xl text-[11px] font-black uppercase tracking-[0.2em] transition-all whitespace-nowrap flex items-center gap-2">
                            <span x-text="cat"></span>
                            <span class="text-[9px] opacity-60 font-semibold" x-text="'(' + countByCategory(cat) + ')'"></span>
                        </button>
                    </template>
                </div>
            </div>

            <!-- ПУСТОЙ КАТАЛОГ -->
            <template x-if="filteredProducts.length === 0">
                <div class="glass rounded-3xl p-16 text-center max-w-xl mx-auto my-12">
                    <div class="w-16 h-16 rounded-2xl bg-white/5 mx-auto flex items-center justify-center text-gray-500 mb-4">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/></svg>
                    </div>
                    <h3 class="text-xl font-bold mb-2">В этой категории пока нет тканей</h3>
                    <p class="text-gray-400 text-sm mb-6">Добавьте ткани в панель управления или переключитесь на другую категорию.</p>
                    <template x-if="isAdmin">
                        <button @click="openCreateProductModal(activeCat !== 'Все' ? activeCat : '')" class="px-6 py-3 accent-bg rounded-xl text-xs font-black uppercase tracking-wider">
                            + Добавить ткань в категорию
                        </button>
                    </template>
                </div>
            </template>

            <!-- СЕТКА ТОВАРОВ -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 md:gap-10">
                <template x-for="p in filteredProducts" :key="p.id">
                    <div class="group glass-card rounded-[2.5rem] p-5 flex flex-col h-full border border-white/5 hover:border-orange-500/30 transition-all duration-300">
                        
                        <!-- КАРТИНКА И СЛАЙДЕР -->
                        <div class="aspect-[4/5] rounded-[2rem] overflow-hidden bg-black/40 relative mb-5 shadow-xl select-none">
                            <img :src="p.images[p.activeImgIdx || 0] || 'https://images.unsplash.com/photo-1544441893-675973e31985?w=800'" 
                                 :alt="p.name"
                                 class="w-full h-full object-cover group-hover:scale-105 transition duration-700">
                            
                            <!-- Бейдж категории -->
                            <div class="absolute top-4 left-4 glass px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-wider text-orange-400">
                                <span x-text="p.category"></span>
                            </div>

                            <!-- Индикатор количества фото -->
                            <template x-if="p.images && p.images.length > 1">
                                <div class="absolute top-4 right-4 glass px-3 py-1 rounded-full text-[10px] font-bold">
                                    <span x-text="( (p.activeImgIdx || 0) + 1 ) + '/' + p.images.length"></span>
                                </div>
                            </template>

                            <!-- Точки листания фото -->
                            <template x-if="p.images && p.images.length > 1">
                                <div class="absolute bottom-4 left-0 right-0 flex justify-center gap-1.5 z-10 px-4">
                                    <template x-for="(img, imgIndex) in p.images" :key="imgIndex">
                                        <button @click.stop="p.activeImgIdx = imgIndex" 
                                                :class="(p.activeImgIdx || 0) === imgIndex ? 'w-6 bg-orange-500' : 'w-2 bg-white/40 hover:bg-white'" 
                                                class="h-1.5 rounded-full transition-all duration-300"></button>
                                    </template>
                                </div>
                            </template>

                            <!-- Быстрые кнопки управления для админа прямо на карточке -->
                            <template x-if="isAdmin">
                                <div class="absolute top-4 right-4 flex items-center gap-1.5 opacity-90 group-hover:opacity-100 transition z-20">
                                    <button @click.stop="editProduct(p)" 
                                            title="Редактировать товар"
                                            class="w-8 h-8 rounded-full glass hover:bg-orange-600 text-white flex items-center justify-center transition shadow-lg">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
                                    </button>
                                    <button @click.stop="deleteProduct(p.id)" 
                                            title="Удалить товар"
                                            class="w-8 h-8 rounded-full glass hover:bg-red-600 text-white flex items-center justify-center transition shadow-lg">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                                    </button>
                                </div>
                            </template>
                        </div>

                        <!-- ИНФО О ТОВАРЕ -->
                        <div class="flex justify-between items-start px-2 mb-2">
                            <h3 class="text-2xl font-bold uppercase tracking-tight italic" x-text="p.name"></h3>
                            <span class="text-2xl font-black text-orange-500 whitespace-nowrap" x-text="formatPrice(p.price) + ' ₽'"></span>
                        </div>
                        <p class="px-2 text-sm text-gray-400 line-clamp-3 leading-relaxed flex-grow mb-6" x-text="p.desc"></p>
                        
                        <!-- КНОПКА ЗАКАЗА -->
                        <div class="mt-auto space-y-2">
                            <a :href="'https://wa.me/79000000000?text=' + encodeURIComponent('Здравствуйте! Меня интересует мебельная ткань: ' + p.name + ' (' + p.category + '), цена: ' + p.price + ' руб.')" 
                               target="_blank"
                               class="flex items-center justify-center gap-3 w-full py-4 bg-white text-black rounded-2xl font-black uppercase text-[11px] tracking-[0.2em] hover:bg-orange-600 hover:text-white transition duration-300 shadow-lg">
                                <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/></svg>
                                <span>Заказать в WhatsApp</span>
                            </a>
                        </div>
                    </div>
                </template>
            </div>
        </main>
    </template>

    <!-- ПАНЕЛЬ УПРАВЛЕНИЯ (АДМИНКА) -->
    <template x-if="view === 'admin'">
        <section class="pt-28 md:pt-36 px-4 md:px-6 max-w-5xl mx-auto pb-24" x-cloak>
            
            <!-- ШАПКА АДМИНКИ -->
            <div class="flex flex-wrap justify-between items-center gap-4 mb-8">
                <div>
                    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-orange-500/20 text-orange-400 text-[10px] font-black uppercase tracking-widest mb-2">
                        Режим администратора
                    </div>
                    <h2 class="text-3xl md:text-5xl font-black uppercase italic tracking-tight">Панель управления</h2>
                </div>
                <div class="flex items-center gap-3">
                    <button @click="view='catalog'" class="px-5 py-2.5 glass rounded-2xl text-xs font-bold uppercase tracking-wider hover:bg-white/10 transition">
                        Вернуться на сайт
                    </button>
                    <button @click="logout()" class="px-4 py-2.5 bg-red-600/20 hover:bg-red-600 text-red-300 hover:text-white rounded-2xl text-xs font-bold uppercase tracking-wider transition">
                        Выйти
                    </button>
                </div>
            </div>

            <!-- ВКЛАДКИ АДМИНКИ -->
            <div class="flex border-b border-white/10 gap-3 md:gap-6 mb-8 overflow-x-auto no-scrollbar">
                <button @click="adminTab = 'products'" 
                        :class="adminTab === 'products' ? 'border-orange-500 text-orange-400' : 'border-transparent text-gray-400 hover:text-white'"

                    if (savedCats) {
                        try {
                            this.categories = JSON.parse(savedCats);
                        } catch(e) {
                            this.categories = [...DEFAULT_CATEGORIES];
                        }
                    } else {
                        this.categories = [...DEFAULT_CATEGORIES];
                    }

                    // 3. Загрузка товаров
                    const savedProds = localStorage.getItem('mega_upholstery_v2');
                    if (savedProds) {
                        try {
                            this.products = JSON.parse(savedProds);
                        } catch(e) {
                            this.products = [...DEFAULT_PRODUCTS];
                        }
                    } else {
                        this.products = [...DEFAULT_PRODUCTS];
                    }

                    if (this.categories.length > 0) {
                        this.form.category = this.categories[0];
                    }

                    this.syncStorage();
                },

                syncStorage() {
                    localStorage.setItem('mega_categories_v2', JSON.stringify(this.categories));
                    localStorage.setItem('mega_upholstery_v2', JSON.stringify(this.products));
                    localStorage.setItem('mega_bg_image_v2', this.currentBg);
                },

                // Авторизация
                login() {
                    const pass = prompt('Введите пароль администратора:');
                    const inputNumber = Number(pass)
                    if (Number(pass) === '373697779' ) {
                        this.isAdmin = true;
                        this.view = 'admin';
                    } else if (pass !== null) {
                        alert('Неверный пароль.');
                    }
                },

                logout() {
                    this.isAdmin = false;
                    this.view = 'catalog';
                },

                countByCategory(cat) {
                    return this.products.filter(p => p.category === cat).length;
                },

                get filteredProducts() {
                    if (this.activeCat === 'Все') return this.products;
                    return this.products.filter(p => p.category === this.activeCat);
                },

                formatPrice(price) {
                    return Number(price || 0).toLocaleString('ru-RU');
                },

                // ==================== УПРАВЛЕНИЕ ФОНОМ ====================
                handleBgUpload(e) {
                    const file = e.target.files && e.target.files[0];
                    if (!file) return;

                    const reader = new FileReader();
                    reader.onload = (event) => {
                        this.currentBg = event.target.result;
                        this.bgInputUrl = this.currentBg;
                        localStorage.setItem('mega_bg_image_v2', this.currentBg);
                        alert('Фоновое изображение успешно обновлено и сохранено!');
                    };
                    reader.readAsDataURL(file);
                },

                applyBgUrl() {
                    if (!this.bgInputUrl.trim()) return alert('Укажите URL или имя файла');
                    this.currentBg = this.bgInputUrl.trim();
                    localStorage.setItem('mega_bg_image_v2', this.currentBg);
                    alert('Фон успешно изменен!');
                },

                resetBgToDefault() {
                    if (confirm('Сбросить фон сайта к "background.jpg"?')) {
                        this.currentBg = DEFAULT_BG;
                        this.bgInputUrl = DEFAULT_BG;
                        localStorage.setItem('mega_bg_image_v2', this.currentBg);
                    }
                },

                resetAllDemoData() {
                    if (confirm('Сбросить все товары, категории и фон к стандартным демо-данным?')) {
                        this.categories = [...DEFAULT_CATEGORIES];
                        this.products = [...DEFAULT_PRODUCTS];
                        this.currentBg = DEFAULT_BG;
                        this.syncStorage();
                        alert('Данные сброшены к начальным!');
                    }
                },

                // ==================== CRUD КАТЕГОРИЙ ====================
                addCategory() {
                    const name = this.newCategoryName.trim();
                    if (!name) return alert('Введите название категории');
                    if (name.toLowerCase() === 'все') return alert('Имя "Все" зарезервировано для общего фильтра');
                    if (this.categories.some(c => c.toLowerCase() === name.toLowerCase())) {
                        return alert('Такая категория уже существует!');
                    }

                    this.categories.push(name);
                    this.newCategoryName = '';
                    this.syncStorage();
                },

                renameCategory(oldName) {
                    const newName = prompt('Новое название для категории "' + oldName + '":', oldName);
                    if (!newName || newName.trim() === '' || newName.trim() === oldName) return;

                    const trimmed = newName.trim();
                    if (trimmed.toLowerCase() === 'все') return alert('Имя "Все" зарезервировано');
                    if (this.categories.some(c => c.toLowerCase() === trimmed.toLowerCase() && c !== oldName)) {
                        return alert('Категория с таким именем уже существует!');
                    }

                    const idx = this.categories.indexOf(oldName);
                    if (idx !== -1) {
                        this.categories.splice(idx, 1, trimmed);
                    }

                    // Обновляем категорию во всех товарах
                    this.products.forEach(p => {
                        if (p.category === oldName) {
                            p.category = trimmed;
                        }
                    });

                    if (this.activeCat === oldName) {
                        this.activeCat = trimmed;
                    }

                    if (this.form.category === oldName) {
                        this.form.category = trimmed;
                    }

                    this.syncStorage();
                },

                deleteCategory(catName) {
                    const count = this.countByCategory(catName);
                    let confirmMsg = 'Удалить категорию "' + catName + '"?';
                    if (count > 0) {
                        confirmMsg += '\nВнимание: в этой категории находится ' + count + ' товаров. Они будут перемещены в другую категорию.';
                    }

                    if (!confirm(confirmMsg)) return;

                    this.categories = this.categories.filter(c => c !== catName);

                    const fallbackCat = this.categories.length > 0 ? this.categories[0] : 'Без категории';
                    if (fallbackCat === 'Без категории' && !this.categories.includes('Без категории')) {
                        this.categories.push('Без категории');
                    }

                    this.products.forEach(p => {
                        if (p.category === catName) {
                            p.category = fallbackCat;
                        }
                    });

                    if (this.activeCat === catName) {
                        this.activeCat = 'Все';
                    }

                    if (this.form.category === catName) {
                        this.form.category = fallbackCat;
                    }

                    this.syncStorage();
                },

                // ==================== CRUD ТОВАРОВ ====================
                openCreateProductModal(prefCat) {
                    this.resetForm();
                    if (prefCat && this.categories.includes(prefCat)) {
                        this.form.category = prefCat;
                    }
                    this.view = 'admin';
                    this.adminTab = 'products';
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                },

                editProduct(p) {
                    this.form = {
                        id: p.id,
                        name: p.name,
                        price: p.price,
                        category: p.category,
                        desc: p.desc,
                        images: [...(p.images || [])]
                    };
                    this.view = 'admin';
                    this.adminTab = 'products';
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                },

                resetForm() {
                    this.form = {
                        id: null,
                        name: '',
                        price: '',
                        category: this.categories.length > 0 ? this.categories[0] : '',
                        desc: '',
                        images: []
                    };
                    this.imageUrlInput = '';
                },

                handleFiles(e) {
                    const files = e.target.files;
                    if (!files || !files.length) return;

                    for (let file of files) {
                        const reader = new FileReader();
                        reader.onload = (event) => {
                            this.form.images.push(event.target.result);
                        };
                        reader.readAsDataURL(file);
                    }
                },

                addImageByUrl() {
                    const url = this.imageUrlInput.trim();
                    if (!url) return;
                    this.form.images.push(url);
                    this.imageUrlInput = '';
                },

                saveProduct() {
                    if (!this.form.name.trim()) return alert('Укажите название ткани!');
                    if (!this.form.price || Number(this.form.price) <= 0) return alert('Укажите корректную цену!');
                    if (!this.form.category) return alert('Выберите категорию ткани!');

                    if (!this.form.images.length) {
                        this.form.images.push('https://images.unsplash.com/photo-1544441893-675973e31985?w=800');
                    }

                    if (this.form.id) {
                        // Редактирование
                        const idx = this.products.findIndex(p => p.id === this.form.id);
                        if (idx !== -1) {
                            this.products[idx] = {
                                ...this.products[idx],
                                name: this.form.name.trim(),
                                price: Number(this.form.price),
                                category: this.form.category,
                                desc: this.form.desc.trim(),
                                images: [...this.form.images]
                            };
                        }
                    } else {
                        // Создание нового
                        const newProd = {
                            id: Date.now(),
                            name: this.form.name.trim(),
                            price: Number(this.form.price),
                            category: this.form.category,
                            desc: this.form.desc.trim(),
                            images: [...this.form.images],
                            activeImgIdx: 0
                        };
                        this.products.unshift(newProd);
                    }

                    this.syncStorage();
                    this.resetForm();
                    this.view = 'catalog';
                },

                deleteProduct(id) {
                    const prod = this.products.find(p => p.id === id);
                    if (!prod) return;
                    if (!confirm('Вы точно хотите удалить ткань "' + prod.name + '"?')) return;

                    this.products = this.products.filter(p => p.id !== id);
                    this.syncStorage();
                }
            };
        }
    </script>
</body>
</html>
